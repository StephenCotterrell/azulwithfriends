<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 660">
  <defs>
    <linearGradient id="table" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#e0e8e3"/><stop offset="1" stop-color="#c5d3cd"/>
    </linearGradient>
    <linearGradient id="glaze" x2=".55" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="white" stop-opacity=".24"/><stop offset=".35" stop-color="white" stop-opacity=".02"/>
      <stop offset=".9" stop-color="#142d4a" stop-opacity=".03"/><stop offset="1" stop-color="#142d4a" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="linen" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 1H5M1 0V5" stroke="#304738" stroke-opacity=".035" stroke-width=".7"/>
    </pattern>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7">
      <feDropShadow dx="2" dy="5" stdDeviation="2" flood-color="#304132" flood-opacity=".27"/>
      <feDropShadow dx="5" dy="12" stdDeviation="7" flood-color="#405046" flood-opacity=".16"/>
    </filter>
    <clipPath id="edge"><rect width="100" height="100" rx="5"/></clipPath>
    <g id="finish">
      <rect x=".8" y=".8" width="98.4" height="98.4" rx="4.2" fill="url(#glaze)" stroke="#fff" stroke-opacity=".42" stroke-width="1.5"/>
      <path d="M2 95Q2 98 6 98H94Q98 98 98 94" fill="none" stroke="#6c604e" stroke-width="1.5" opacity=".32"/>
    </g>
    <g id="petal" fill="#f6ecd6">
      <path d="M50 50C23 42 19 16 25 9C42 10 55 30 50 50Z"/>
      <path d="M50 50C23 42 19 16 25 9C42 10 55 30 50 50Z" transform="rotate(90 50 50)"/>
      <path d="M50 50C23 42 19 16 25 9C42 10 55 30 50 50Z" transform="rotate(180 50 50)"/>
      <path d="M50 50C23 42 19 16 25 9C42 10 55 30 50 50Z" transform="rotate(270 50 50)"/>
    </g>
    <g id="flower" clip-path="url(#edge)">
      <rect width="100" height="100" fill="#285378"/><use href="#petal"/>
      <circle cx="50" cy="50" r="8" fill="#d7a249"/>
      <path d="M0 0H14L0 14ZM100 0H86L100 14ZM0 100H14L0 86ZM100 100H86L100 86Z" fill="#91b3b4"/>
      <use href="#finish"/>
    </g>
    <g id="wave" clip-path="url(#edge)">
      <rect width="100" height="100" fill="#f7ecd7"/>
      <g stroke="#337b82" stroke-width="8" fill="none">
        <circle r="74"/><circle r="56"/><circle r="38"/><circle r="20"/>
        <circle cx="100" cy="100" r="55"/><circle cx="100" cy="100" r="37"/><circle cx="100" cy="100" r="19"/>
      </g>
      <use href="#finish"/>
    </g>
    <g id="sun" clip-path="url(#edge)">
      <rect width="100" height="100" fill="#d99543"/>
      <path d="M50 8 60 31 82 18 70 41 93 50 70 59 82 82 60 70 50 93 40 70 18 82 30 59 7 50 30 41 18 18 40 31Z" fill="#fcebc9"/>
      <path d="m50 34 16 16-16 16-16-16Z" fill="#b06a32"/>
      <use href="#finish"/>
    </g>
    <g id="terracotta" clip-path="url(#edge)">
      <rect width="100" height="100" fill="#b65f42"/>
      <g stroke="#fadfba" fill="none" stroke-width="4">
        <path d="M50 5Q52 37 93 50Q55 54 50 95Q43 57 7 50Q45 40 50 5Z"/>
        <path d="M50 23Q53 43 75 50Q54 57 50 77Q44 56 25 50Q44 44 50 23Z"/>
      </g>
      <g fill="#f4c486"><circle cx="13" cy="13" r="4"/><circle cx="87" cy="13" r="4"/><circle cx="13" cy="87" r="4"/><circle cx="87" cy="87" r="4"/></g>
      <use href="#finish"/>
    </g>
    <g id="trellis" clip-path="url(#edge)">
      <rect width="100" height="100" fill="#f1e3c7"/>
      <path d="m50 0 50 50-50 50L0 50Z" fill="#2d6183"/>
      <path d="M50 5Q48 42 13 50Q47 53 50 94Q55 56 89 50Q55 44 50 5Z" fill="#a9c5c4"/>
      <path d="m50 35 15 15-15 15-15-15Z" fill="#fbf0d5"/>
      <circle cx="50" cy="50" r="4" fill="#c18b45"/><use href="#finish"/>
    </g>
  </defs>
  <rect width="620" height="660" fill="url(#table)"/>
  <rect width="620" height="660" fill="url(#linen)"/>
  <g transform="translate(310 330) rotate(-10) scale(1.4) translate(-157 -157)" filter="url(#shadow)">
    <use href="#flower" transform="rotate(-2 50 50)"/>
    <use href="#wave" x="108" transform="rotate(2 158 50)"/>
    <use href="#sun" x="222" y="-10" transform="rotate(9 272 40)"/>
    <use href="#trellis" y="109" transform="rotate(1 50 159)"/>
    <use href="#terracotta" x="108" y="109" transform="rotate(-1 158 159)"/>
    <use href="#flower" x="217" y="109" transform="rotate(90 267 159)"/>
    <use href="#sun" x="-7" y="220" transform="rotate(-5 43 270)"/>
    <use href="#wave" x="108" y="217" transform="rotate(180 158 267)"/>
    <use href="#trellis" x="217" y="217" transform="rotate(1 267 267)"/>
  </g>
</svg>
